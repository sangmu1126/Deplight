name: Cleanup Legacy Resources

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE LEGACY" to remove only legacy deplight-platform tables'
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE LEGACY" ]; then
            echo 'Type "DELETE LEGACY" to proceed.'
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify target account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT_ID" != "265233844540" ]; then
            echo "Refusing cleanup in unexpected AWS account: $ACCOUNT_ID"
            exit 1
          fi

      - name: Delete legacy DynamoDB tables
        run: |
          set -euo pipefail
          TABLES=(
            "deplight-platform-ai-analysis"
            "deplight-platform-deployment-history"
            "deplight-platform-deployment-logs"
          )
          for table in "${TABLES[@]}"; do
            if aws dynamodb describe-table --table-name "$table" --region "$AWS_REGION" >/dev/null 2>&1; then
              aws dynamodb delete-table --table-name "$table" --region "$AWS_REGION" >/dev/null
              echo "Deletion started: $table"
            else
              echo "Not found: $table"
            fi
          done
