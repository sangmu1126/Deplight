name: Analyzer Lambda

on:
  push:
    branches: [main]
    paths:
      - "deplight-platform-v3/lambda/ai_code_analyzer/**"
      - "deplight-platform-v3/scripts/package_lambda.sh"
      - ".github/workflows/analyzer.yml"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Existing Lambda function name"
        required: true
        default: "delightful-deploy-ai-analyzer"
      invoke_after_deploy:
        description: "Invoke the Lambda once after update"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: delightful-deploy-analyzer
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  FUNCTION_NAME: ${{ inputs.function_name || 'delightful-deploy-ai-analyzer' }}

jobs:
  package-and-deploy:
    name: Package and deploy analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda
        working-directory: ./deplight-platform-v3
        run: ./scripts/package_lambda.sh

      - name: Verify Terraform-managed function exists
        run: |
          aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            >/dev/null

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://deplight-platform-v3/build/ai_analyzer.zip \
            --region "$AWS_REGION" \
            >/dev/null

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Verify Lambda configuration
        run: |
          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query '{Runtime:Runtime,Handler:Handler,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output table

      - name: Invoke Lambda
        if: ${{ inputs.invoke_after_deploy == true }}
        run: |
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            response.json
          cat response.json
