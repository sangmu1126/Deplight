name: Deploy Dashboard to ECS

on:
  workflow_dispatch:
    inputs:
      enable_github_dispatch:
        description: "Inject the provisioned GitHub token into Dashboard"
        required: false
        default: false
        type: boolean
      enable_dashboard_deployments:
        description: "Inject the provisioned Dashboard API key"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: delightful-deploy-dashboard
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: delightful-deploy
  ECS_CLUSTER: delightful-deploy-cluster
  ECS_SERVICE: delightful-deploy-dashboard-service
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deplight-app/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dashboard-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dashboard-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: ./deplight-platform-v3/infrastructure/terraform
        run: terraform init -reconfigure

      - name: Select platform workspace
        working-directory: ./deplight-platform-v3/infrastructure/terraform
        run: terraform workspace select default

      - name: Reconcile Dashboard task definition
        working-directory: ./deplight-platform-v3/infrastructure/terraform
        run: |
          terraform plan \
            -var="enable_dashboard_github_dispatch=${{ inputs.enable_github_dispatch }}" \
            -var="enable_dashboard_deployments=${{ inputs.enable_dashboard_deployments }}" \
            -target=aws_iam_role_policy.ecs_execution_ssm_policy \
            -target=aws_ecs_task_definition.dashboard \
            -target=aws_ecs_service.dashboard \
            -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Deploy dashboard-latest
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names delightful-deploy-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "http://${ALB_DNS}/dashboard/api/health"
