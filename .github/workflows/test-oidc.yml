name: Test AWS OIDC
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect OIDC Token Payload
        run: |
          TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          PAYLOAD=$(echo -n $TOKEN | cut -d '.' -f 2)
          # Use python to decode base64url and pretty print JSON without triggering secret masks
          python3 -c "import base64, json; payload = '$PAYLOAD'; payload += '=' * (-len(payload) % 4); decoded = base64.urlsafe_b64decode(payload).decode('utf-8'); print('OIDC_SUB:', json.loads(decoded).get('sub')); print('OIDC_AUD:', json.loads(decoded).get('aud'))"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::265233844540:role/github-actions-deplight-role
          aws-region: ap-northeast-2
      - name: Test AWS Identity
        run: aws sts get-caller-identity
